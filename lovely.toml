[manifest]
version = "1.0.0"
# high so other shop sign mods (UnBlind) patch first and their sign wins,
# the rest of this mod still works with their sign
priority = 10

# Replace the shop sign creation block with our boss blind display
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = '''
    local shop_sign = AnimatedSprite(0,0, 4.4, 2.2, G.ANIMATION_ATLAS['shop_sign'])
    shop_sign:define_draw_steps({
      {shader = 'dissolve', shadow_height = 0.05},
      {shader = 'dissolve'}
    })
    G.SHOP_SIGN = UIBox{
      definition =
        {n=G.UIT.ROOT, config = {colour = G.C.DYN_UI.MAIN, emboss = 0.05, align = 'cm', r = 0.1, padding = 0.1}, nodes={
          {n=G.UIT.R, config={align = "cm", padding = 0.1, minw = 4.72, minh = 3.1, colour = G.C.DYN_UI.DARK, r = 0.1}, nodes={
            {n=G.UIT.R, config={align = "cm"}, nodes={
              {n=G.UIT.O, config={object = shop_sign}}
            }},
            {n=G.UIT.R, config={align = "cm"}, nodes={
              {n=G.UIT.O, config={object = DynaText({string = {localize('ph_improve_run')}, colours = {lighten(G.C.GOLD, 0.3)},shadow = true, rotate = true, float = true, bump = true, scale = 0.5, spacing = 1, pop_in = 1.5, maxw = 4.3})}}
            }},
          }},
        }},
      config = {
        align="cm",
        offset = {x=0,y=-15},
        major = G.HUD:get_UIE_by_ID('row_blind'),
        bond = 'Weak'
      }
    }
    G.E_MANAGER:add_event(Event({
      trigger = 'immediate',
      func = (function()
          G.SHOP_SIGN.alignment.offset.y = 0
          return true
      end)
    }))'''
position = "at"
payload = '''
    G.SHOP_SIGN = UIBox{
      definition = G.UIDEF.BossBlindShopSign_display(),
      config = {
        align="cm",
        offset = {x=0,y=-15},
        major = G.HUD:get_UIE_by_ID('row_blind'),
        bond = 'Weak'
      }
    }
    G.SHOP_SIGN.bbss_sign = true
    -- -0.2 is where the sign rests after sliding in (vanilla uses 0),
    -- the -15 above is just where it starts
    G.E_MANAGER:add_event(Event({
      trigger = 'immediate',
      func = (function()
          G.SHOP_SIGN.alignment.offset.y = -0.2
          return true
      end)
    }))
    -- Optional: fade the sign in at screen center instead (center_spawn.lua).
    if BossBlindShopSign.start_center_spawn then BossBlindShopSign.start_center_spawn(G.SHOP_SIGN) end'''
match_indent = true

# Append our UI function to UI_definitions.lua so it's available when the shop opens
[[patches]]
[patches.copy]
target = "functions/UI_definitions.lua"
position = "append"
sources = [
    "ui.lua",
]

# Append chip_UI_set hook + deck-view played-card marker + ante-change sign refresh after button_callbacks.lua.
# button_callbacks.lua loads after common_events.lua, so copy_card is already defined.
[[patches]]
[patches.copy]
target = "functions/button_callbacks.lua"
position = "append"
sources = [
    "chip_ui_hook.lua",
    "played_marker.lua",
    "ante_refresh.lua",
    "center_spawn.lua",
]
